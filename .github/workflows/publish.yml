name: Publish

# npm trusted publishing (OIDC): configure this repository and `publish.yml` as a trusted
# publisher for catcard-sdk on npmjs.com. No npm token is stored in GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish under
        type: choice
        options: [latest, next]
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 ships npm 11, which supports trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in the release workflow (cache poisoning).
      - run: npm ci
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm run check
      # Tag pushes publish as `latest`; a manual run can publish a pre-release under `next`.
      - run: npm publish --tag ${{ inputs.dist-tag || 'latest' }}
