name: Publish

# npm trusted publishing (OIDC): configure this repository and `publish.yml` as a trusted
# publisher for catcard-sdk on npmjs.com. No npm token is stored in GitHub.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish under
        type: choice
        options: [next, latest]
        default: next

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11, which supports trusted publishing.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm run check
      # Releases stay on `next` until promoted (npm dist-tag add catcard-sdk@<version> latest).
      - run: npm publish --tag ${{ inputs.dist-tag || 'next' }}
